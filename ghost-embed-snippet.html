<!-- Homicide vs. recovery funding — Vital City embed -->
<div class="vc-embed-homicide-funding-scatter" style="margin:1.5em 0;">
  <div style="position:relative;width:100%;border:1px solid #111;overflow:hidden;">
    <iframe
      class="vc-embed-homicide-funding-scatter__iframe"
      src="https://vital-city-nyc.github.io/homicide-funding-scatter/?embed=1"
      title="Homicide fell most where it had risen most, not where federal recovery funding was highest"
      loading="lazy"
      scrolling="no"
      style="display:block;width:100%;height:760px;border:0;background:transparent;"
    ></iframe>
  </div>
  <script>
    (function () {
      window.addEventListener('message', function (e) {
        var d = e && e.data;
        if (!d || d.type !== 'vc-embed-height' || d.id !== 'homicide-funding-scatter') return;
        var f = document.querySelector('.vc-embed-homicide-funding-scatter__iframe');
        if (f && typeof d.height === 'number') f.style.height = d.height + 'px';
      });
    })();
  </script>
</div>
